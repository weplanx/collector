name: 测试

on:
  push:
    branches: [ v3 ]
    paths-ignore: [ 'README*', 'docs/**' ]
  pull_request:
    branches: [ v3 ]
    paths-ignore: [ 'README*', 'docs/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go: [ '1.24.x', '1.26.x' ]
    env:
      CGO_ENABLED: '1'
      NATS_HOSTS: nats://127.0.0.1:4222
      NATS_TOKEN: s3cr3t
      MONGO_URL: mongodb://root:password@127.0.0.1:27017
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: 启动测试服务
        run: docker compose -f .github/compose/docker-compose.yml up -d
      - name: 等待测试服务就绪
        run: |
          for i in {1..60}; do
            if nc -z localhost 4222 && docker compose -f .github/compose/docker-compose.yml exec -T mongodb mongosh --quiet --username root --password password --authenticationDatabase admin --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f .github/compose/docker-compose.yml logs
          exit 1
      - name: 编译与静态检查
        run: |
          go build ./...
          go vet -tags=e2e ./...
      - name: 单元及集成测试
        run: go test -race -tags=e2e -timeout=3m -covermode=atomic -coverprofile=covprofile ./...
      - name: 停止测试服务
        if: always()
        run: docker compose -f .github/compose/docker-compose.yml down -v
      - name: 上传覆盖率
        if: success() && github.event_name == 'push' && matrix.go == '1.26.x'
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -coverprofile=covprofile -service=github
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
